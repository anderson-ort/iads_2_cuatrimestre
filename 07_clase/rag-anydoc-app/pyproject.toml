[project]
name = "ortelana-naive-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "firecrawl-anydoc>=0.2.4",
    "langchain-chroma>=1.1.0",
    "langchain-cohere>=0.6.0",
    "langchain-core>=1.6.3",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "torchvision>=0.29.0",
    "typer>=0.12.0",
]

[tool.uv]
# Esta app son scripts planos (cli.py, app.py) sobre ingester/: no es un paquete
# instalable. Sin esto, uv intenta construir un modulo que no existe al hacer
# uv sync / uv run.
package = false
