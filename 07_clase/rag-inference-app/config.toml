[app]
title = "Asistente RAG + Router"

[llm]
router_model = "gemini-2.5-flash-lite"
router_temperature = 0.0
router_thinking_budget = 0
rag_model = "gemini-2.5-flash"
rag_temperature = 0.0

[retrieval]
k_candidatos = 10
top_n = 4

[reranker]
default = "crossencoder"
crossencoder_model = "cross-encoder/ms-marco-MiniLM-L-6-v2"
cohere_model = "rerank-multilingual-v3.0"

[embeddings]
# El modelo y la coleccion de cada provider no se definen aca: se leen del
# config.toml de rag-anydoc-app (provider -> model_name/dimensions/collection_name)
# para que el retrieval use exactamente el vectorstore que creo la ingesta.
default_provider = "huggingface"
