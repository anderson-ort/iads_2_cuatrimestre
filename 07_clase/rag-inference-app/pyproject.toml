[project]
name = "rag-inference-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "streamlit>=1.64.0",
  "python-dotenv>=1.0.0",
  "langchain-chroma>=1.1.0",
  "langchain-cohere>=0.6.0",
  "langchain-core>=1.6.3",
  "langchain-google-genai>=4.4.0",
  "langchain-huggingface>=1.2.2",
  "langchain-text-splitters>=1.1.2",
  "python-dotenv>=1.0.0",
  "sentence-transformers>=6.1.0",
  "torchvision>=0.29.0",

]

[project.scripts]
rag-inference-app = "rag_inference_app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Esta app son scripts planos (cli.py, app.py) sobre src/: no es un paquete
# instalable. Sin esto, uv intenta construir un modulo rag_inference_app que
# no existe al hacer uv sync / uv run.
package = false
