version: '3'

dotenv: ['.env']

vars:
  APP: main:app
  APP_DIR: .
  HOST: 0.0.0.0
  PORT: 8000

tasks:
  install:
    desc: Instala las dependencias del proyecto
    cmds:
      - uv sync

  dev:
    desc: Corre la API en modo desarrollo (con reload)
    deps: [check:env]
    cmds:
      - uv run uvicorn {{.APP}} --app-dir {{.APP_DIR}} --reload --host {{.HOST}} --port {{.PORT}}

  run:
    desc: Corre la API en modo produccion (sin reload)
    deps: [check:env]
    cmds:
      - uv run uvicorn {{.APP}} --app-dir {{.APP_DIR}} --host {{.HOST}} --port {{.PORT}}

  check:env:
    desc: Verifica que GEMINI_API_KEY este seteada
    silent: true
    cmds:
      - |
        if [ -z "$GEMINI_API_KEY" ]; then
          echo "ERROR: GEMINI_API_KEY no esta seteada. Revisa tu archivo .env"
          exit 1
        fi
        echo "GEMINI_API_KEY detectada correctamente."

  clean:
    desc: Eliminar data innecesaria
    cmds:
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name .pytest_cache -exec rm -rf {} + 2>/dev/null || true
      - find . -type d -name .venv -exec rm -rf {} + 2>/dev/null || true
      - find . -type f -name "*.pyc" -delete
