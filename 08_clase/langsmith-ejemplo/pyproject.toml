[project]
name = "langsmith-ejemplo"
version = "0.1.0"
description = "RAG de la clase 07 trazado con LangSmith y evaluado con RAGAS como experimento"
requires-python = ">=3.13"
dependencies = [
    "firecrawl-anydoc>=0.2.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4,<0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.4",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "sentence-transformers>=6.1.0",
]

[tool.uv]
package = false
