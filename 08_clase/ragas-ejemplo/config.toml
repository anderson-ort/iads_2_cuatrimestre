# Parámetros de ragas_eval.py.
# Las rutas relativas se resuelven desde esta carpeta (08_clase/ragas-ejemplo/).
#
# Idea de la clase: cada bloque de "PIPELINE" es una perilla del RAG.
# Cambiá una perilla, volvé a correr y RAGAS te dice si mejoró o empeoró
# comparando contra baseline.json (evaluación como regresión).

# ---------------------------------------------------------------------------
# PIPELINE RAG (lo que se evalúa). Mismo pipeline que 07_clase/.muestra_clase.
# ---------------------------------------------------------------------------

[ingesta]
archivos = [
    "../../07_clase/documents/promociones_telas_ortelana.pdf",
    "../../07_clase/documents/promociones_envios_distribucion_ortelana.docx",
    "../../07_clase/documents/reglas_alta_distribuidores_ortelana.pdf",
]
persist_dir = "chroma_db"

[embeddings]
model_name = "sentence-transformers/all-MiniLM-L6-v2"   # entrenado en inglés
# Experimento: modelo multilingüe (los documentos están en español).
# model_name = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

[chunking]
size = 800                        # probá 200: suele bajar Context Recall
overlap = 120

[retrieval]
k_candidatos = 10                 # bi-encoder: cuántos traer de Chroma
top_n = 4                         # contextos que llegan al LLM. Probá 1: baja Recall
usar_reranker = true              # probá false: suele bajar Context Precision
crossencoder_model = "cross-encoder/ms-marco-MiniLM-L-6-v2"

[llm]

# rag_model = "gemma-4-31b-it"     # free tier: ~20 requests/día (8 por corrida)
rag_model = "gemini-3.5-flash-lite"     # free tier: ~20 requests/día (8 por corrida)
rag_temperature = 0.0

# ---------------------------------------------------------------------------
# EVALUACIÓN (el "juez"). No forma parte del RAG: solo lo mide.
# ---------------------------------------------------------------------------

[evaluacion]
dataset = "golden_set.json"
judge_model = "gemini-3.5-flash-lite"  # juez: muchas llamadas por caso, conviene un modelo con cuota amplia
judge_embeddings = "gemini-embedding-001"
pausa_segundos = 4                # pausa entre casos para no chocar el rate limit
salida_dir = "resultados"
baseline = "baseline.json"

# Política de CI (ver ragas.md, "Evaluación como regresión").
[evaluacion.umbral_minimo]        # piso absoluto por métrica (promedio)
faithfulness = 0.80
answer_relevancy = 0.70
context_precision = 0.70
context_recall = 0.70

[evaluacion.caida_maxima]         # cuánto puede bajar cada métrica vs baseline
faithfulness = 0.03
answer_relevancy = 0.05
context_precision = 0.05
context_recall = 0.05
