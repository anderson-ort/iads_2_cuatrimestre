[project]
name = "ortelana-app"
version = "0.1.0"
description = "Ortelana production conversational assistant (class 11)"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.1",
    "fastapi>=0.162.0",
    "firecrawl-anydoc>=0.2.4",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-cohere>=0.6.0",
    "langchain-community<0.4.2",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-mongodb>=0.5.1",
    "nemoguardrails>=0.24.1",
    "openai>=2,<3",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]
